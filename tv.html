<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Xpresia TV</title><style>html,body{margin:0;width:100%;height:100%;background:#030713;color:#fff;font-family:Arial,sans-serif;overflow:hidden}body{display:grid;place-items:center}.wrap{text-align:center;padding:5vw}.logo{font-size:clamp(42px,9vw,100px);font-weight:900;color:#fff;text-shadow:0 0 20px #00e5ff,0 0 45px #ff00df}.sub{margin-top:12px;color:#bfefff;font-size:clamp(16px,2.5vw,28px)}.status{margin-top:28px;color:#8ff7ff;font-size:clamp(13px,1.8vw,20px)}</style></head><body><main class="wrap"><div class="logo">Xpresia</div><div class="sub">Arte y expresión en movimiento</div><div class="status" id="status">Modo TV listo</div></main><script>(function(){function show(m){document.getElementById('status').textContent=m}try{if(window.presentationReceiver&&presentationReceiver.connectionList){presentationReceiver.connectionList.then(function(list){list.connections.forEach(bind)});function bind(c){c.addEventListener('message',function(e){try{const d=JSON.parse(e.data);if(d.type==='xpresia-tv-init')show('Conectado a Xpresia · listo para mostrar la experiencia en pantalla grande')}catch(_){}})}}}catch(e){console.warn(e)}window.addEventListener('load',function(){show('Modo TV listo · esperando conexión')})})();</script></body></html>
